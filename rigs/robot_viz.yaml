#
# Run with: python -m isaacteleop.rig rigs/robot_viz.yaml
#
# Two panes, one declared: with no `runtime:` key the runtime pane comes from
# DEFAULT_RUNTIME_COMMAND. No producers either -- the app opens the OpenXR
# session itself and reads controllers straight from the runtime, so there is no
# rendezvous and deliberately no `params:` / `collection_id:`.
#
# `{python}` expands to the launching interpreter, so a Televiz build of the wheel must be
# installed there rather than in a private .venv.
#
# See rigs/se3_tracker.yaml for the fully annotated exemplar of every key.
name: robot_viz
description: CloudXR runtime + a robot twin in XR with the SO-101 leader gripper
cwd: ..                        # -> Teleop repo root
consumers:
  - name: robot viz app (requires headset)
    # Keep --no-launch-cloudxr-runtime. The runtime is a host singleton on WSS port 48322,
    # so a second one kills this rig's own pane: the headset drops mid-session and reads as
    # a runtime crash rather than a config edit. find_runtime_footguns() warns, never gates.
    # PYTHONPATH is inline because the rig schema takes only {name, command}.
    command: "PYTHONPATH=examples/robot_viz/python {python} -m isaacteleop_examples.robot_viz --no-launch-cloudxr-runtime"
