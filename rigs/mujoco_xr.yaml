#
# Run with: python -m isaacteleop.rig rigs/mujoco_xr.yaml
#
# Two panes: the CloudXR runtime, and the app. Only ONE is declared below --
# there is no `runtime:` key here, so the runtime pane is IMPLICIT: with
# `runtime` unset, RigConfig.runtime_command falls back to
# DEFAULT_RUNTIME_COMMAND (`{python} -m isaacteleop.cloudxr --accept-eula`,
# isaacteleop/rig/config.py:42,89-91). `consumers:` therefore lists only the
# app. There are no producers -- the app opens the OpenXR session itself
# (through Televiz) and reads controllers straight from the runtime, so there
# is no producer/consumer rendezvous and therefore deliberately no `params:` /
# `collection_id:` here.
#
# REQUIRES TWO WHEELS IN ONE ENVIRONMENT, and that environment is the one you
# launch the rig from. `{python}` below expands to the LAUNCHING interpreter
# (rig/config.py:249, shlex.quote(sys.executable)), so
# `-m isaacteleop_examples.mujoco_xr` resolves against it -- which means the
# isaacteleop-examples-mujoco-xr wheel must be installed beside `isaacteleop`
# rather than in a private .venv of its own. This is new: the command used to be
# `uv run --directory install/examples/mujoco_xr/python ...`, which built its own
# environment out of the install tree. Nothing is installed to
# install/examples/mujoco_xr/ any more; the example is its own wheel.
#
#   cmake --preset py3.12 -DBUILD_VIZ=ON
#   uv pip install --python build/cmake-cpython-312/teleop_build_venv/bin/python "mujoco==3.11.0"
#   cmake --preset py3.12 -DBUILD_VIZ=ON        # re-configure: NOW mujoco is found
#   cmake --build --preset py3.12 --parallel
#   uv pip install "isaacteleop[cloudxr]" --find-links=./install/wheels/ --reinstall
#   uv pip install ./examples/mujoco_xr        # same environment as the line above
#
# The first four lines build the repo (the mujoco probe runs at CONFIGURE time,
# so the first configure necessarily skips this example and a second one is
# required after the wheel exists). Only the last two are needed to RUN this
# rig -- `uv pip install ./examples/mujoco_xr` compiles the extension itself and
# does not read the CMake build tree at all. Full explanation in
# examples/mujoco_xr/README.md#build.
#
# See rigs/se3_tracker.yaml for the fully annotated exemplar of every key.
name: mujoco_xr
description: CloudXR runtime + MuJoCo tabletop scene in XR with controller markers
cwd: ..                        # -> Teleop repo root
consumers:
  - name: mujoco xr app (requires headset)
    # --no-launch-cloudxr-runtime IS NOT A NO-OP. Removing it makes the app
    # start a SECOND CloudXR runtime, and the runtime is a host singleton on
    # WSS port 48322 -- the second one kills the framework's runtime pane
    # (the implicit one described in the header).
    #
    # Delete the flag and this rig kills its own runtime pane: the headset drops
    # mid-session and the failure looks like a runtime crash rather than a
    # config edit.
    #
    # THE RIG'S OWN LINT NOW CATCHES THAT, and it did not before the package was
    # namespaced. find_runtime_footguns() recognises a Python app by the
    # SUBSTRING `-m isaacteleop` or a `.py` token (rig/config.py:264-288); the
    # old command was `-m mujoco_xr`, which is neither, so dropping the flag was
    # silent and this comment was the only guard. `-m isaacteleop_examples...`
    # contains `-m isaacteleop`, so the warning fires. That is a side effect of
    # the rename, not something the lint was taught -- keep this comment anyway,
    # since the lint is warn-only and never a gate.
    #
    # `-m isaacteleop_examples.mujoco_xr` resolves from site-packages, not from
    # cwd: the package is an installed wheel and `cwd: ..` (the repo root)
    # contains no directory that could shadow it.
    command: "{python} -m isaacteleop_examples.mujoco_xr --no-launch-cloudxr-runtime"
