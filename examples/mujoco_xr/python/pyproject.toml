#
# The installed copy of this file gets a [tool.uv] block appended by
# cmake/InstallPythonExample.cmake. There is deliberately no [build-system]:
# `uv run --directory .` then treats the project as virtual and puts this
# directory on sys.path, which is what makes `python -m mujoco_xr` find both
# the .py sources and the _mujoco_xr*.so beside them.

[project]
name = "mujoco-xr-example"
version = "0.0.0"  # Internal example - not versioned
description = "MuJoCo scene rendered into an Isaac Teleop Televiz XR session"

# ABI-PINNED, unlike the ">=3.11,<3.14" the pure-Python examples here use.
# This package ships _mujoco_xr*.so, built by the interpreter the CMake preset
# resolved (cpython-3.12). A wider range lets uv select 3.13 and the extension
# will not load -- measured, not assumed. `environments` in the generated
# [tool.uv] block is a RESOLUTION constraint and does NOT select the
# interpreter, so it cannot substitute for this line.
requires-python = "==3.12.*"

dependencies = [
    # EXACT pin, and one of only TWO places the version is written (the other
    # is ../tests/pyproject.toml). ../CMakeLists.txt READS this line rather
    # than repeating it, and fails the configure if the version installed in
    # the build interpreter disagrees -- so the drift is caught here and not as
    # an ImportError on the headset. libmujoco's SONAME is fully versioned with
    # no unversioned symlink, so a mismatch can never be silent struct-layout
    # corruption, but it is still a hard failure.
    "mujoco==3.11.0",
    # isaacteleop (which provides isaacteleop.viz) comes from the locally built
    # wheel via the generated [tool.uv] find-links entry in the install tree.
    "isaacteleop",
]
