[project]
name = "isaacteleop-logging-config-tests"
version = "0.0.0"  # Internal tests - not versioned
description = "Tests for isaacteleop.logging_config"
requires-python = ">=3.11,<3.14"

[project.optional-dependencies]
dev = [
    "pytest",
    # Not imported by these tests. `from isaacteleop import logging_config` runs
    # isaacteleop/__init__.py, whose eager import list reaches
    # retargeting_engine.interface.tunable_parameter, and that imports numpy.
    # Every other leaf here that touches isaacteleop declares it for the same reason.
    "numpy",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Prevent pytest from recursing into parent directories
norecursedirs = [".git", ".venv", "build", "dist", "*.egg", "__pycache__"]
