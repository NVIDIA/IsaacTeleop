[project]
name = "teleopcore-logging-config-tests"
version = "0.0.0"  # Internal tests - not versioned
description = "Logging system tests for TeleopCore (Python and C++ socket halves)"
requires-python = ">=3.11,<3.14"

[project.optional-dependencies]
dev = [
    "pytest",
    "numpy",  # `import isaaccapture` pulls in retargeting_engine
]
test = [
    "pytest",
    "numpy",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Prevent pytest from recursing into parent directories
norecursedirs = [".git", ".venv", "build", "dist", "*.egg", "__pycache__"]
