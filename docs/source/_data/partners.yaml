#
# Source of truth for the Ecosystem page partner cards; rendered by the
# ``partner-grid`` directive (docs/source/_ext/partner_grid.py).
#
# Adding a partner:
#   1. Append a record below. Required: id, organization, product_name, section,
#      lifecycle, category, description, links, order.
#   2. Drop the logo in docs/source/_static/partner-logos/ and point logo.src at it.
#      Omit the whole `logo` key to render the organization name as a text wordmark.
#      Add logo.src_dark when a single-color mark would vanish in the other theme;
#      the two files are swapped automatically by light/dark mode.
#
# Controlled values -- do not invent synonyms:
#   section             platform | active | upcoming
#     platform is the first-party band: NVIDIA stacks and teams that Isaac Teleop is
#     built into, not partners who plug in. Keep it to NVIDIA.
#   lifecycle           maintained | upcoming | deprecated
#   integration_status  planning | in-integration        (optional)
#   links[].kind        internal | external | tracking | contact
#     internal needs exactly one of `doc` (a docname) or `ref` (a label);
#     external and tracking need `url`.
#     tracking urls must end in an issue or pull number: the card appends it to the
#     label, so `label: Tracking` renders as "Tracking #274". Do not write the
#     number into the label yourself.
#     contact needs a `contact` mapping (name, email, optional phone and title) and
#     opens a popover on the card instead of navigating. Publishing someone's name,
#     address, or number here puts it on a public site and in git history: use a role
#     alias where one exists, and get the person's consent where one does not.
#
# new_until is an unquoted YYYY-MM-DD date. Up to that date the card shows a
# green "New" badge, after which it falls back to its lifecycle label with no
# edit required.

partners:
