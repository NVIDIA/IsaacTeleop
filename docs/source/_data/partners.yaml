#
# Source of truth for the Ecosystem page partner cards; rendered by the
# ``partner-grid`` directive (docs/source/_ext/partner_grid.py).
#
# A supported device is a row in _data/devices.yaml, not a card here. A company may have
# both (Haptikos, MANUS, PICO) or either one alone, and neither file derives from the
# other -- a card says who works with us, a row says what you can plug in.
#
# Adding a partner:
#   1. Add a record below. Required: id, organization, product_name, section,
#      lifecycle, category, plus description and links outside the upcoming band.
#      Unknown fields fail the build, so check the list here before inventing one.
#   2. Drop the logo in docs/source/_static/partner-logos/ and point logo.src at it.
#      Omit the whole `logo` key to render the organization name as a text wordmark.
#      Add logo.src_dark when a single-color mark would vanish in the other theme;
#      the two files are swapped automatically by light/dark mode.
#
# Controlled values -- do not invent synonyms:
#   section             platform | active | upcoming
#     platform is the first-party band: NVIDIA stacks and teams that Isaac Teleop is
#     built into, not partners who plug in. Keep it to NVIDIA.
#   lifecycle           maintained | upcoming | deprecated
#   links[].kind        internal | external | tracking | contact
#     internal needs exactly one of `doc` (a docname) or `ref` (a label);
#     external and tracking need `url`.
#     tracking urls must end in an issue or pull number: the card appends it to the
#     label, so `label: Tracking` renders as "Tracking #274". Do not write the
#     number into the label yourself.
#     contact needs a `contact` mapping (name, email, optional phone and title) and
#     opens a popover on the card instead of navigating. Publishing someone's name,
#     address, or number here puts it on a public site and in git history: use a role
#     alias where one exists, and get the person's consent where one does not.
#
# Card order:
#   active and upcoming sort alphabetically by organization, so those records carry no
#   `order` field -- the build rejects one. Keep the records below in that same order
#   so the file reads like the page.
#   platform is hand-ordered and requires a unique integer `order` within the section.
#
# The platform band renders no logo panel and no status pill: every entry is NVIDIA and
# active, which the section heading and subtitle already say. Those records need a
# `handle` instead -- the role that stack plays, in two or three words, as a chip --
# and the build rejects `logo`, `new_until`, and any lifecycle but maintained on them,
# rather than accept a field that renders nowhere. `version` is optional and must be
# quoted; it renders as a quiet suffix after the title, so it stays out of the
# description.
#
# The upcoming band is the other end: nothing is integrated yet, so the card is a
# wordmark, a category, and a tracking link once one exists. It renders no description
# and the build rejects one, and a partner with no public page yet carries no `links` at
# all rather than a placeholder.
#
# new_until is an unquoted YYYY-MM-DD date. Up to that date the card shows a
# green "New" badge, after which it falls back to its lifecycle label with no
# edit required.

