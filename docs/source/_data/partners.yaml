  - id: nvidia-gear
    organization: NVIDIA
    product_name: NVIDIA GEAR
    section: platform
    lifecycle: maintained
    category: Research
    type: Foundation Models
    # logo source: nvidia-sphinx-theme, the horizontal two-color screen logo. The eye
    # is #76b900 in both files; only the wordmark changes, black on light and white on
    # dark, so both themes need their own file.
    logo:
      src: nvidia.svg
      src_dark: nvidia-dark.svg
      alt: NVIDIA logo
    description: >
      NVIDIA Research's Generalist Embodied Agent Research group. GEAR collects
      real-robot demonstrations through Isaac Teleop and trains the GR00T foundation
      models on them.
    links:
      - label: Overview
        kind: external
        url: https://research.nvidia.com/labs/gear/
      - label: GR00T
        kind: external
        url: https://nvlabs.github.io/GR00T-WholeBodyControl/tutorials/isaac_teleop_publisher_setup.html
    order: 10

